name: Build Arlo ChirunoMod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone ChirunoMod v0.2.2
        run: |
          git clone --branch v0.2.2 --depth 1 \
            https://github.com/ChainSwordCS/ChirunoMod.git \
            ChirunoMod

      - name: Apply Arlo Old3DS socket test
        run: |
          python3 - <<'PY'
          p = "ChirunoMod/soos/main.cpp"

          with open(p, "r") as f:
              lines = f.readlines()

          found_poll = False
          found_accept = False

          for i, line in enumerate(lines):
              if "else if(pollsock(sock, POLLIN) == POLLIN)" in line:
                  lines[i] = line.replace(
                      "else if(pollsock(sock, POLLIN) == POLLIN)",
                      "else"
                  )
                  found_poll = True

              if "else if(pollsock(sock, POLLERR) == POLLERR)" in line:
                  lines[i] = line.replace(
                      "else if(pollsock(sock, POLLERR) == POLLERR)",
                      "if(false)"
                  )

              if "int cli = accept(sock, (struct sockaddr*)&sai, &sizeof_sai);" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = (
                      indent + "sizeof_sai = sizeof(sai);\n" +
                      indent + "int cli = accept(sock, (struct sockaddr*)&sai, &sizeof_sai);\n"
                  )
                  found_accept = True

          if not found_poll or not found_accept:
              raise SystemExit(
                  f"Patch target missing: pollsock={found_poll}, accept={found_accept}"
              )

          with open(p, "w") as f:
              f.writelines(lines)

          print("Arlo socket patch applied")
          PY

      - name: Add Arlo socket diagnostics
        run: |
          python3 - <<'PY2'
          p = "ChirunoMod/soos/main.cpp"

          with open(p, "r") as f:
              s = f.read()

          s = s.replace(
              "sock = r;",
              """sock = r;
              printf("ARLODBG socket=%i errno=%i %s\\n", sock, errno, strerror(errno));""",
              1
          )

          old_bind = """if(bind(sock, (struct sockaddr*)&sao, sizeof(sao)) < 0)"""
          new_bind = """int arlo_bind_ret = bind(sock, (struct sockaddr*)&sao, sizeof(sao));
              printf("ARLODBG bind=%i errno=%i %s\\n", arlo_bind_ret, errno, strerror(errno));
              if(arlo_bind_ret < 0)"""

          if old_bind not in s:
              raise SystemExit("BIND TARGET NOT FOUND")

          s = s.replace(old_bind, new_bind, 1)

          old_listen = """if(listen(sock, 1) < 0)"""
          new_listen = """int arlo_listen_ret = listen(sock, 1);
                  printf("ARLODBG listen=%i errno=%i %s\\n", arlo_listen_ret, errno, strerror(errno));
                  if(arlo_listen_ret < 0)"""

          if old_listen not in s:
              raise SystemExit("LISTEN TARGET NOT FOUND")

          s = s.replace(old_listen, new_listen, 1)

          with open(p, "w") as f:
              f.write(s)

          print("ARLO SOCKET DIAGNOSTICS ADDED")
          PY2

      - name: Bind ChirunoMod to all interfaces
        run: |
          python3 - <<'PY2'
          p = "ChirunoMod/soos/main.cpp"

          with open(p) as f:
              s = f.read()

          old = "sao.sin_addr.s_addr = gethostid();"
          new = "sao.sin_addr.s_addr = htonl(INADDR_ANY);"

          if old not in s:
              raise SystemExit("ARLO: bind-address target not found")

          s = s.replace(old, new, 1)

          with open(p, "w") as f:
              f.write(s)

          print("ARLO: changed listener address from gethostid() to INADDR_ANY")
          PY2

      - name: Zero initialize ChirunoMod sockaddr
        run: |
          python3 - <<'PY2'
          p = "ChirunoMod/soos/main.cpp"

          with open(p) as f:
              s = f.read()

          target = "struct sockaddr_in sao;"

          if target not in s:
              raise SystemExit("ARLO: sockaddr declaration not found")

          s = s.replace(
              target,
              target + "\n            memset(&sao, 0, sizeof(sao));",
              1
          )

          with open(p, "w") as f:
              f.write(s)

          print("ARLO: sockaddr zero initialization inserted")
          PY2

      - name: Show patched section
        run: |
          sed -n '2190,2210p' ChirunoMod/soos/main.cpp


      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential wget curl unzip bzip2 xz-utils             libmbedtls-dev liblz4-dev cmake pkg-config

      - name: Install devkitARM r46
        run: |
          sudo mkdir -p /opt/devkitpro
          wget -q \
            "https://wii.leseratte10.de/devkitPro/devkitARM/r46%20%282017%29/devkitARM_r46-x86_64-linux.tar.bz2" \
            -O /tmp/devkitARM.tar.bz2

          sudo tar -xjf /tmp/devkitARM.tar.bz2 -C /opt/devkitpro

          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"

      - name: Install libctru 1.2.1
        run: |
          wget -q \
            "https://wii.leseratte10.de/devkitPro/libctru/2017/libctru-1.2.1.tar.bz2" \
            -O /tmp/libctru.tar.bz2

          echo "Archive layout:"
          tar -tjf /tmp/libctru.tar.bz2 | head -30

          rm -rf /tmp/libctru-extract
          mkdir -p /tmp/libctru-extract

          tar -xjf /tmp/libctru.tar.bz2 -C /tmp/libctru-extract

          sudo rm -rf /opt/devkitpro/libctru
          sudo mkdir -p /opt/devkitpro/libctru

          CTROOT="$(find /tmp/libctru-extract -type f -name 3ds.h -printf '%h\n' | head -1)"

          if [ -z "$CTROOT" ]; then
            echo "ERROR: 3ds.h not found in archive"
            find /tmp/libctru-extract -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found 3ds.h in: $CTROOT"

          CTBASE="$(dirname "$CTROOT")"
          sudo cp -a "$CTBASE"/. /opt/devkitpro/libctru/

          echo "Installed libctru:"
          ls -la /opt/devkitpro/libctru/include/3ds.h
          ls -la /opt/devkitpro/libctru/lib

      - name: Verify legacy compiler
        run: |
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          ls -la /opt/devkitpro/libctru

      - name: Install legacy 3DS portlibs
        run: |
          git clone --depth 1 \
            https://github.com/LoveMHz/3DS-Portlibs.git \
            /tmp/3ds-portlibs

          cd /tmp/3ds-portlibs

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$PATH"

          make zlib
          sudo -E make install-zlib

          python3 - <<'PATCH'
          p = "Makefile"

          with open(p, "r") as f:
              lines = f.readlines()

          inside_jpeg = False
          changed = False

          for i, line in enumerate(lines):
              if line.startswith("$(LIBJPEGTURBO):"):
                  inside_jpeg = True
                  continue

              if inside_jpeg and line.startswith("$(") and not line.startswith("$(LIBJPEGTURBO)"):
                  break

              if inside_jpeg and "./configure" in line:
                  lines[i] = line.rstrip("\n") + " --without-simd\n"
                  changed = True
                  break

          if not changed:
              raise SystemExit("Could not locate libjpeg-turbo configure command")

          with open(p, "w") as f:
              f.writelines(lines)

          print("libjpeg-turbo SIMD disabled")
          PATCH

          grep -n -A6 -B3 "LIBJPEGTURBO" Makefile | head -40

          make libjpeg-turbo || true

          cd libjpeg-turbo-1.4.2

          make libjpeg.la libturbojpeg.la

          sudo mkdir -p /opt/devkitpro/portlibs/armv6k/include
          sudo mkdir -p /opt/devkitpro/portlibs/armv6k/lib

          sudo cp jpeglib.h jerror.h jmorecfg.h turbojpeg.h             /opt/devkitpro/portlibs/armv6k/include/

          sudo cp .libs/libjpeg.a             /opt/devkitpro/portlibs/armv6k/lib/

          sudo cp .libs/libturbojpeg.a             /opt/devkitpro/portlibs/armv6k/lib/

          cd ..

          echo "Checking TurboJPEG install:"
          ls -l /opt/devkitpro/portlibs/armv6k/include/turbojpeg.h
          ls -l /opt/devkitpro/portlibs/armv6k/lib/libturbojpeg.a

          echo "Checking turbojpeg:"
          find /opt/devkitpro/portlibs -name turbojpeg.h -print
          find /opt/devkitpro/portlibs -name 'libturbojpeg*' -print

      - name: Install makerom and bannertool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/makerom-release
          cd /tmp/makerom-release

          ASSET="$(gh release view makerom-v0.19.0             --repo 3DSGuy/Project_CTR             --json assets             -q '.assets[].name' | grep -Ei 'linux|ubuntu' | head -1)"

          echo "Using makerom asset: $ASSET"

          if [ -z "$ASSET" ]; then
            echo "Available assets:"
            gh release view makerom-v0.19.0               --repo 3DSGuy/Project_CTR               --json assets               -q '.assets[].name'
            exit 1
          fi

          gh release download makerom-v0.19.0             --repo 3DSGuy/Project_CTR             --pattern "$ASSET"

          unzip -o "$ASSET" >/dev/null 2>&1 || true
          tar -xf "$ASSET" >/dev/null 2>&1 || true

          MAKEROM="$(find . -type f -name makerom | head -1)"

          if [ -z "$MAKEROM" ]; then
            echo "makerom binary not found after extraction"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$MAKEROM"
          sudo cp "$MAKEROM" /usr/local/bin/makerom

          cd /tmp

          wget -q             https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip             -O bannertool.zip

          rm -rf /tmp/bannertool-bin
          mkdir -p /tmp/bannertool-bin

          unzip -q bannertool.zip -d /tmp/bannertool-bin

          sudo cp /tmp/bannertool-bin/linux-x86_64/bannertool             /usr/local/bin/bannertool

          sudo chmod +x /usr/local/bin/bannertool

          echo "Packaging tools:"
          which makerom
          which bannertool
          makerom -h >/dev/null || true
          bannertool --help >/dev/null || true

      - name: Build ArloSocketTest with legacy toolchain
        run: |
          rm -rf ArloSocketTest-legacy

          git clone --depth 1 \
            https://github.com/AlphaByte4820/ArloSocketTest.git \
            ArloSocketTest-legacy

          echo "===== LEGACY TOOLCHAIN ====="
          arm-none-eabi-gcc --version | head -1

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "===== BUILDING LEGACY SOCKET TEST ====="
          make -C ArloSocketTest-legacy

          echo "===== RESULT ====="
          ls -lh ArloSocketTest-legacy/ArloSocketTest.3dsx

      - name: Upload legacy ArloSocketTest
        uses: actions/upload-artifact@v4
        with:
          name: ArloSocketTest-legacy-${{ github.run_number }}
          path: ArloSocketTest-legacy/ArloSocketTest.3dsx

      - name: Pause after ChirunoMod listen
        run: |
          python3 - <<'PY2'
          p = "ChirunoMod/soos/main.cpp"

          with open(p) as f:
              s = f.read()

          target = "\nreloop:\n"

          if target not in s:
              raise SystemExit("ARLO: reloop marker not found")

          s = s.replace(
              target,
              "\n// ARLO diagnostic: keep listener alive before accept logic\nsvcSleepThread(30000000000LL);\n\nreloop:\n",
              1
          )

          with open(p, "w") as f:
              f.write(s)

          print("ARLO: inserted 30-second post-listen pause")
          PY2

      - name: Build patched ChirunoMod
        working-directory: ChirunoMod
        run: |
          # Old libjpeg-turbo 1.4.2 collides with newer devkitARM stdlib random()
          # Disable ARM SIMD for this legacy JPEG build; ChirunoMod does not need
          # the old jsimd_arm path for our networking test.
          sed -i 's/^JSIMD_ARM=.*/JSIMD_ARM=/' Makefile 2>/dev/null || true
          # ARLO: pause for 30 seconds immediately before reloop
        sed -i '/^[[:space:]]*reloop:/i\\    svcSleepThread(30000000000LL); // ARLO LISTEN TEST' soos/main.cpp
        grep -n -B2 -A2 'ARLO LISTEN TEST' soos/main.cpp
        make -j2

      - name: Show build output
        run: |
          find ChirunoMod -maxdepth 2 \
            \( -name "*.cia" -o -name "*.elf" \) \
            -print

      - name: Upload patched CIA
        uses: actions/upload-artifact@v4
        with:
          name: ChirunoMod-Arlo-Old3DS-test-${{ github.run_number }}
          path: ChirunoMod/ChirunoMod.cia
          if-no-files-found: error


      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget curl unzip bzip2 xz-utils

      - name: Install devkitARM r46
        run: |
          sudo mkdir -p /opt/devkitpro
          wget -q \
            "https://wii.leseratte10.de/devkitPro/devkitARM/r46%20%282017%29/devkitARM_r46-x86_64-linux.tar.bz2" \
            -O /tmp/devkitARM.tar.bz2

          sudo tar -xjf /tmp/devkitARM.tar.bz2 -C /opt/devkitpro

          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"

      - name: Install libctru 1.2.1
        run: |
          sudo mkdir -p /opt/devkitpro/libctru
          wget -q \
            "https://wii.leseratte10.de/devkitPro/libctru/2017/libctru-1.2.1.tar.bz2" \
            -O /tmp/libctru.tar.bz2

          sudo tar -xjf /tmp/libctru.tar.bz2 \
            -C /opt/devkitpro/libctru \
            --strip-components=1 || \
          sudo tar -xjf /tmp/libctru.tar.bz2 \
            -C /opt/devkitpro/libctru

      - name: Verify legacy compiler
        run: |
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          ls -la /opt/devkitpro/libctru

      - name: Build patched ChirunoMod
        working-directory: ChirunoMod
        run: |
          make -j2

      - name: Show build output
        run: |
          find ChirunoMod -maxdepth 2 \
            \( -name "*.cia" -o -name "*.elf" \) \
            -print

      - name: Upload patched CIA
        uses: actions/upload-artifact@v4
        with:
          name: ChirunoMod-Arlo-Old3DS-test
          path: ChirunoMod/ChirunoMod.cia
          if-no-files-found: error

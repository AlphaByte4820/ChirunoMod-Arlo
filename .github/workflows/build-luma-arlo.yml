name: Build Arlo Luma HID Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-luma-arlo.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Clone Luma
        run: |
          git clone --branch v13.4 --depth 1 https://github.com/LumaTeam/Luma3DS.git Luma3DS

      - name: Patch InputRedirection to HID only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Luma3DS/sysmodules/rosalina/source/input_redirection.c")
          s = p.read_text()

          start = s.index("Result InputRedirection_DoOrUndoPatches(void)")
          brace = s.index("{", start)

          depth = 0
          end = None

          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("Could not locate end of patch function")

          replacement = """Result InputRedirection_DoOrUndoPatches(void)
          {
              static bool hidPatched = false;
              Handle hidProcHandle = 0;

              svcKernelSetState(0x10000, 4);

              Result res = OpenProcessByName("hid", &hidProcHandle);

              if(R_SUCCEEDED(res))
              {
                  res = InputRedirection_DoUndoHidPatches(
                      hidProcHandle,
                      !hidPatched
                  );

                  if(R_SUCCEEDED(res))
                      hidPatched = !hidPatched;
              }

              svcKernelSetState(0x10000, 4);

              if(hidProcHandle)
                  svcCloseHandle(hidProcHandle);

              return res;
          }"""

          p.write_text(s[:start] + replacement + s[end:])

          print("ARLO: HID-only InputRedirection patch applied")
          PY

      - name: Verify patch
        run: |
          grep -n -A35 "Result InputRedirection_DoOrUndoPatches" \
            Luma3DS/sysmodules/rosalina/source/input_redirection.c

      - name: Install makerom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update
          apt-get install -y unzip gh

          mkdir -p /tmp/makerom-release
          cd /tmp/makerom-release

          ASSET="$(gh release view makerom-v0.19.0 \
            --repo 3DSGuy/Project_CTR \
            --json assets \
            -q '.assets[].name' | grep -Ei 'linux|ubuntu' | head -1)"

          echo "Using makerom asset: $ASSET"

          if [ -z "$ASSET" ]; then
            echo "No Linux makerom asset found"
            gh release view makerom-v0.19.0 \
              --repo 3DSGuy/Project_CTR \
              --json assets \
              -q '.assets[].name'
            exit 1
          fi

          gh release download makerom-v0.19.0 \
            --repo 3DSGuy/Project_CTR \
            --pattern "$ASSET"

          unzip -o "$ASSET" >/dev/null 2>&1 || true
          tar -xf "$ASSET" >/dev/null 2>&1 || true

          MAKEROM="$(find . -type f -name makerom | head -1)"

          if [ -z "$MAKEROM" ]; then
            echo "makerom binary not found"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$MAKEROM"
          cp "$MAKEROM" /usr/local/bin/makerom

          echo "makerom installed:"
          which makerom

      - name: Build Luma
        working-directory: Luma3DS
        run: |
          make -j2

      - name: Verify boot firm
        run: |
          ls -lh Luma3DS/boot.firm

      - name: Upload Arlo Luma
        uses: actions/upload-artifact@v4
        with:
          name: Arlo-Luma-v14-HID-only-${{ github.run_number }}
          path: Luma3DS/boot.firm
